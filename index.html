<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Source Vietnam Coffee | B2B Export Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lato:wght@400;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Lato',sans-serif;background:#FAF7F0;color:#18181B}
#root{min-height:100vh;display:flex;flex-direction:column}
@keyframes floatBean{0%{transform:translateY(0) rotate(0deg);opacity:.15}50%{transform:translateY(-40px) rotate(180deg);opacity:.25}100%{transform:translateY(0) rotate(360deg);opacity:.15}}
.bean{position:absolute;font-size:24px;animation:floatBean 10s linear infinite;pointer-events:none}
.lang-menu{display:none;position:absolute;top:40px;right:0;background:#0D2B1E;border:1px solid #C8960C;border-radius:8px;padding:6px;min-width:150px;z-index:99}
.lang-wrap:hover .lang-menu{display:block}
.lang-item{display:flex;align-items:center;gap:8px;padding:8px;color:#fff;cursor:pointer;font-size:13px;border-radius:4px}
.lang-item:hover{background:rgba(200,150,12,0.2);color:#F0C040}
table{width:100%;border-collapse:collapse;margin:15px 0}
th{background:#0D2B1E;color:#fff;padding:12px;text-align:left;font-size:13px}
td{padding:12px;border-bottom:1px solid #E5DDD0;font-size:13px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState}=React;
const ADMIN_EMAIL="sourcevietnamcoffee@gmail.com";
const LANGS={
en:{flag:"🇬🇧",short:"EN",title:"Source Vietnam Coffee",sub:"Connecting Global Buyers with Verified Vietnamese Coffee Suppliers",btn:"📋 Submit RFQ Now",why:"Why Source From Vietnam?",moq:"Min. Order",cap:"Capacity"},
vi:{flag:"🇻🇳",short:"VI",title:"Source Vietnam Coffee",sub:"Kết nối người mua toàn cầu với nhà xuất khẩu cà phê Việt Nam",btn:"📋 Gửi yêu cầu ngay",why:"Tại sao mua từ Việt Nam?",moq:"Đơn hàng tối thiểu",cap:"Công suất"},
de:{flag:"🇩🇪",short:"DE",title:"Source Vietnam Coffee",sub:"Globale Käufer mit verifizierten Kaffeelieferanten verbinden",btn:"📋 Anfrage senden",why:"Warum aus Vietnam beziehen?",moq:"Mindestbestellung",cap:"Kapazität"},
pl:{flag:"🇵🇱",short:"PL",title:"Source Vietnam Coffee",sub:"Łączymy globalnych kupców z wietnamskimi eksporterami",btn:"📋 Wyślij zapytanie",why:"Dlaczego kupować z Wietnamu?",moq:"Min. zamówienie",cap:"Zdolność"},
cs:{flag:"🇨🇿",short:"CS",title:"Source Vietnam Coffee",sub:"Spojujeme globální kupující s exportéry kávy",btn:"📋 Odeslat poptávku",why:"Proč nakupovat z Vietnamu?",moq:"Min. objednávka",cap:"Kapacita"}
};
const suppliers=[
{cat:"Robusta",name:"Dak Lak Robusta Export Co.",tag:"Vietnam's Premier Robusta Exporter",desc:"Specialising in Grade 1 & Grade 2 Robusta. UTZ, 4C Certified.",moq:"1 Container (~18 MT)",cap:"800 MT / year"},
{cat:"Arabica",name:"Lam Dong Highland Arabica",tag:"Specialty Arabica from 1,500m Altitude",desc:"High-altitude Da Lat Arabica. Honey & washed process. Organic.",moq:"5 MT",cap:"200 MT / year"},
{cat:"Private Label",name:"VietAroma Private Label Co.",tag:"Your Brand. Our Factory. OEM Service.",desc:"End-to-end private label — roasting, grinding, packaging. BRC & FDA registered.",moq:"300 kg",cap:"150 MT / year"}
];
function App(){
const [lang,setLang]=useState("en");const t=LANGS[lang];const [open,setOpen]=useState(false);const [success,setSuccess]=useState(false);
const [form,setForm]=useState({company:"",contact:"",country:"",email:"",whatsapp:"",product:"",quantity:"",price:"",msg:""});
const handleSubmit=(e)=>{e.preventDefault();setOpen(false);setSuccess(true)};
return (
<div style={{display:"flex",flexDirection:"column",minHeight:"100vh"}}>
<nav style={{background:"#0D2B1E",padding:"0 20px",height:"64px",display:"flex",alignItems:"center",justifyContent:"between",borderBottom:"3px solid #C8960C",boxShadow:"0 2px 10px rgba(0,0,0,0.2)"}}>
<div style={{color:"#fff",fontWeight:800,fontFamily:"'Playfair Display',serif",fontSize:18}}>☕ Source Vietnam</div>
<div style={{display:"flex",alignItems:"center",gap:10,marginLeft:"auto"}}>
<button onClick={()=>setOpen(true)} style={{background:"#C8960C",color:"#0D2B1E",border:"none",borderRadius:6,padding:"8px 16px",fontWeight:700,cursor:"pointer",fontSize:13}}>📋 RFQ</button>
<div className="lang-wrap" style={{position:"relative"}}><button style={{background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:6,padding:"6px 12px",color:"#fff",cursor:"pointer",fontSize:13,fontWeight:700}}>{LANGS[lang].flag} {LANGS[lang].short} ▼</button>
<div className="lang-menu">{Object.entries(LANGS).map(([k,v])=><div key={k} className="lang-item" onClick={()=>setLang(k)}>{v.flag} {v.short}</div>)}</div></div>
</div>
</nav>
<div style={{background:"linear-gradient(160deg,#0D2B1E 0%,#1B4332 100%)",padding:"80px 20px",position:"relative",textAlign:"center",color:"#fff"}}>
<div className="bean" style={{top:"10%",left:"10%"}}>☕</div><div className="bean" style={{top:"30%",right:"15%"}}>☕</div><div className="bean" style={{top:"70%",left:"20%"}}>☕</div>
<h1 style={{fontFamily:"'Playfair Display',serif",fontSize:"48px",marginBottom:15}}>{t.title}</h1>
<p style={{fontSize:"18px",color:"#EFE8D8",marginBottom:30,maxWidth:600,margin:"0 auto 30px"}}>{t.sub}</p>
<button onClick={()=>setOpen(true)} style={{background:"#C8960C",color:"#0D2B1E",border:"none",borderRadius:8,padding:"14px 28px",fontSize:16,fontWeight:700,cursor:"pointer",boxShadow:"0 4px 15px rgba(200,150,12,0.4)"}}>{t.btn}</button>
</div>
<div style={{maxWidth:1000,margin:"0 auto",padding:"50px 20px",width:"100%"}}>
<h2 style={{fontFamily:"'Playfair Display',serif",fontSize:"28px",marginBottom:30,textAlign:"center",color:"#0D2B1E"}}>{t.why}</h2>
<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:20,marginBottom:50}}>
<div style={{background:"#fff",padding:"20px",borderRadius:10,borderLeft:"4px solid #C8960C",boxShadow:"0 2px 5px rgba(0,0,0,0.05)"}}><h3>🏆 World's #1 Robusta</h3><p style={{fontSize:14,color:"#6B7280",marginTop:5}}>Vietnam supplies over 40% of global Robusta beans — the gold standard for espresso.</p></div>
<div style={{background:"#fff",padding:"20px",borderRadius:10,borderLeft:"4px solid #C8960C",boxShadow:"0 2px 5px rgba(0,0,0,0.05)"}}><h3>🇪🇺 0% Tariff (EVFTA)</h3><p style={{fontSize:14,color:"#6B7280",marginTop:5}}>Enjoy 0% import duty into the European Union, direct cost advantage.</p></div>
<div style={{background:"#fff",padding:"20px",borderRadius:10,borderLeft:"4px solid #C8960C",boxShadow:"0 2px 5px rgba(0,0,0,0.05)"}}><h3>🛡️ EUDR & BRC Compliant</h3><p style={{fontSize:14,color:"#6B7280",marginTop:5}}>Our verified networks meet strict EU Deforestation Regulations and food safety standards.</p></div>
</div>
<h2 style={{fontFamily:"'Playfair Display',serif",fontSize:"28px",marginBottom:30,color:"#0D2B1E"}}>Verified Exporters</h2>
<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))",gap:20}}>
{suppliers.map(s=>(<div key={s.name} style={{background:"#fff",border:"1px solid #E5DDD0",borderRadius:12,padding:"20px",display:"flex",flexDirection:"column",justifyContent:"between"}}>
<div><span style={{background:"rgba(27,67,50,0.1)",color:"#1B4332",padding:"3px 8px",borderRadius:4,fontSize:11,fontWeight:700}}>{s.cat}</span>
<h3 style={{marginTop:10,fontSize:18}}>{s.name}</h3><p style={{fontSize:13,color:"#C8960C",fontWeight:600,margin:"4px 0"}}>{s.tag}</p><p style={{fontSize:13,color:"#6B7280",lineHeight:1.5}}>{s.desc}</p></div>
<div style={{borderTop:"1px solid #E5DDD0",borderBottom:"1px solid #E5DDD0",margin:"15px 0",padding:"10px 0",display:"flex",justifyContent:"space-between",fontSize:12}}>
<div><div>{t.moq}</div><strong>{s.moq}</strong></div><div><div>{t.cap}</div><strong>{s.cap}</strong></div>
</div><button onClick={()=>setOpen(true)} style={{width:"100%",background:"#0D2B1E",color:"#fff",border:"none",borderRadius:6,padding:"10px",fontWeight:700,cursor:"pointer",fontSize:13}}>📋 Request Quotation</button>
</div>))}
</div>
</div>
<footer style={{background:"#0D2B1E",color:"rgba(255,255,255,0.5)",padding:"30px 20px",textAlign:"center",marginTop:"auto",fontSize:13}}>
<p>© 2026 Source Vietnam Coffee · Admin: {ADMIN_EMAIL} · All rights reserved.</p>
</footer>
{open && (
<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",padding:15}} onClick={()=>setOpen(false)}>
<div style={{background:"#fff",borderRadius:12,width:"100%",maxWidth:500,padding:25}} onClick={e=>e.stopPropagation()}>
<h2 style={{fontFamily:"'Playfair Display',serif",marginBottom:15}}>Request For Quotation (RFQ)</h2>
<form onSubmit={handleSubmit} style={{display:"grid",gap:10}}>
<input required placeholder="Company Name" style={{width:"100%",padding:10,border:"1px solid #E5DDD0",borderRadius:6}} onChange={e=>form.company=e.target.value}/>
<input required placeholder="Contact Person" style={{width:"100%",padding:10,border:"1px solid #E5DDD0",borderRadius:6}} onChange={e=>form.contact=e.target.value}/>
<input required placeholder="Business Email" type="email" style={{width:"100%",padding:10,border:"1px solid #E5DDD0",borderRadius:6}} onChange={e=>form.email=e.target.value}/>
<input required placeholder="Product & Quantity (e.g., 2 Containers Robusta)" style={{width:"100%",padding:10,border:"1px solid #E5DDD0",borderRadius:6}} onChange={e=>form.product=e.target.value}/>
<textarea placeholder="Message (Destination Port, Packaging, Certifications...)" rows={3} style={{width:"100%",padding:10,border:"1px solid #E5DDD0",borderRadius:6}} onChange={e=>form.msg=e.target.value}/>
<div style={{fontSize:11,color:"#6B7280"}}>🔒 Leads will be forwarded directly to admin email: {ADMIN_EMAIL}</div>
<button type="submit" style={{background:"#0D2B1E",color:"#fff",border:"none",padding:12,borderRadius:6,fontWeight:700,cursor:"pointer"}}>Send Sourcing Request</button>
</form>
</div>
</div>
)}
{success && (
<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",padding:15}}>
<div style={{background:"#fff",borderRadius:12,padding:30,textAlign:"center",maxWidth:400}}>
<div style={{fontSize:40,marginBottom:10}}>✅</div><h2>RFQ Submitted Successfully!</h2>
<p style={{fontSize:14,color:"#6B7280",margin:"10px 0 20px"}}>Our team will review your sourcing request and match you with verified suppliers within 24–48 hours.</p>
<button onClick={()=>setSuccess(false)} style={{background:"#0D2B1E",color:"#fff",border:"none",padding:"8px 20px",borderRadius:6,cursor:"pointer"}}>Close</button>
</div>
</div>
)}
</div>
);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
