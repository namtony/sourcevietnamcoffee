<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Source Vietnam Coffee | B2B Export Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lato:wght@400;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Lato',sans-serif;background:#F4F0EA;color:#18181B}
#root{min-height:100vh;display:flex;flex-direction:column}
@keyframes floatBean{0%{transform:translateY(0) rotate(0deg);opacity:.1}50%{transform:translateY(-30px) rotate(180deg);opacity:.2}100%{transform:translateY(0) rotate(360deg);opacity:.1}}
.bean{position:absolute;font-size:24px;animation:floatBean 12s linear infinite;pointer-events:none}
.lang-menu{display:none;position:absolute;top:40px;right:0;background:#0D2B1E;border:1px solid #C8960C;border-radius:8px;padding:6px;min-width:150px;z-index:99}
.lang-wrap:hover .lang-menu{display:block}
.lang-item{display:flex;align-items:center;gap:8px;padding:8px;color:#fff;cursor:pointer;font-size:13px;border-radius:4px}
.lang-item:hover {background:rgba(200,150,12,0.2);color:#F0C040}
.supplier-img{width:100%;height:180px;object-fit:cover;background-color:#E5DDD0}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState}=React;
const ADMIN_EMAIL="sourcevietnamcoffee@gmail.com";
const LANGS={
en:{flag:"🇬🇧",short:"EN",title:"Source Vietnam Coffee",sub:"Connecting Global Buyers with Verified Vietnamese Coffee Suppliers",btn:"📋 Submit RFQ Now",why:"Why Source From Vietnam?",moq:"Min. Order",cap:"Capacity"},
vi:{flag:"🇻🇳",short:"VI",title:"Source Vietnam Coffee",sub:"Kết nối người mua toàn cầu với nhà xuất khẩu cà phê Việt Nam",btn:"📋 Gửi yêu cầu ngay",why:"Tại sao mua từ Việt Nam?",moq:"Đơn hàng tối thiểu",cap:"Công suất"},
de:{flag:"🇩🇪",short:"DE",title:"Source Vietnam Coffee",sub:"Globale Käufer mit verifizierten Kaffeelieferanten verbinden",btn:"📋 Anfrage senden",why:"Warum aus Vietnam beziehen?",moq:"Mindestbestellung",cap:"Kapazität"},
pl:{flag:"🇵🇱",short:"PL",title:"Source Vietnam Coffee",sub:"Łączymy globalnych kupców z wietnamskimi eksporterami",btn:"📋 Wyślij zapytanie",why:"Dlaczego kupować z Wietnamu?",moq:"Min. zamówienie",cap:"Zdolność"},
cs:{flag:"🇨🇿",short:"CS",title:"Source Vietnam Coffee",sub:"Spojujeme globální kupující s exportéry kávy",btn:"📋 Odeslat poptávku",why:"Proč nakupovat z Vietnamu?",moq:"Min. objednávka",cap:"Kapacita"}
};
const suppliers=[
{cat:"Robusta",name:"Dak Lak Robusta Export Co.",tag:"Vietnam's Premier Robusta Exporter",desc:"Specialising in Grade 1 & Grade 2 Robusta. UTZ, 4C Certified.",moq:"1 Container (~18 MT)",cap:"800 MT / year",img:"https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?q=80&w=600&auto=format&fit=cover"},
{cat:"Arabica",name:"Lam Dong Highland Arabica",tag:"Specialty Arabica from 1,500m Altitude",desc:"High-altitude Da Lat Arabica. Honey & washed process. Organic.",moq:"5 MT",cap:"200 MT / year",img:"https://images.unsplash.com/photo-1509042239860-f550ce710b93?q=80&w=600&auto=format&fit=cover"},
{cat:"Private Label",name:"VietAroma Private Label Co.",tag:"Your Brand. Our Factory. OEM Service.",desc:"End-to-end private label — roasting, grinding, packaging. BRC & FDA registered.",moq:"300 kg",cap:"150 MT / year",img:"https://images.unsplash.com/photo-1606791405792-1004f1718d0c?q=80&w=600&auto=format&fit=cover"}
];
function App(){
const [lang,setLang]=useState("en");const t=LANGS[lang];const [open,setOpen]=useState(false);const [success,setSuccess]=useState(false);
const [form,setForm]=useState({company:"",contact:"",country:"",email:"",whatsapp:"",product:"",quantity:"",price:"",msg:""});
const handleSubmit=(e)=>{e.preventDefault();setOpen(false);setSuccess(true)};
return (
<div style={{display:"flex",flexDirection:"column",minHeight:"100vh"}}>
<nav style={{background:"#0D2B1E",padding:"0 20px",height:"64px",display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:"3px solid #C8960C",boxShadow:"0 2px 10px rgba(0,0,0,0.2)"}}>
<div style={{color:"#fff",fontWeight:800,fontFamily:"'Playfair Display',serif",fontSize:18}}>☕ Source Vietnam</div>
<div style={{display:"flex",alignItems:"center",gap:10,marginLeft:"auto"}}>
<button onClick={()=>setOpen(true)} style={{background:"#C8960C",color:"#0D2B1E",border:"none",borderRadius:6,padding:"8px 16px",fontWeight:700,cursor:"pointer",fontSize:13}}>📋 RFQ</button>
<div className="lang-wrap" style={{position:"relative"}}><button style={{background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:6,padding:"6px 12px",color:"#fff",cursor:"pointer",fontSize:13,fontWeight:700}}>{LANGS[lang].flag} {LANGS[lang].short} ▼</button>
<div className="lang-menu">{Object.entries(LANGS).map(([k,v])=><div key={k} className="lang-item" onClick={()=>setLang(k)}>{v.flag} {v.short}</div>)}</div></div>
</div>
</nav>
<div style={{background:"linear-gradient(rgba(13,43,30,0.85),rgba(27,67,50,0.9)), url('https://images.unsplash.com/photo-1447933601403-0c6688de566e?q=80&w=1200&auto=format&fit=cover') center/cover",padding:"100px 20px",position:"relative",textAlign:"center",color:"#fff"}}>
<div className="bean" style={{top:"10%",left:"10%"}}>☕</div><div className="bean" style={{top:"30%",right:"15%"}}>☕</div><div className="bean" style={{top:"70%",left:"20%"}}>☕</div>
<h1 style={{fontFamily:"'Playfair Display',serif",fontSize:"52px",marginBottom:15,textShadow:"0 2px 4px rgba(0,0,0,0.5)"}}>{t.title}</h1>
<p style={{fontSize:"19px",color:"#EFE8D8",marginBottom:35,maxWidth:700,margin:"0 auto 35px",textShadow:"0 1px 2px rgba(0,0,0,0.5)"}}>{t.sub}</p>
<button onClick={()=>setOpen(true)} style={{background:"#C8960C",color:"#0D2B1E",border:"none",borderRadius:8,padding:"14px 32px",fontSize:16,fontWeight:700,cursor:"pointer",boxShadow:"0 4px 15px rgba(200,150,12,0.4)"}}>{t.btn}</button>
</div>
<div style={{maxWidth:1100,margin:"0 auto",padding:"60px 20px",width:"100%"}}>
<h2 style={{fontFamily:"'Playfair Display',serif",fontSize:"32px",marginBottom:35,textAlign:"center",color:"#0D2B1E"}}>{t.why}</h2>
<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))",gap:25,marginBottom:60}}>
<div style={{background:"#fff",padding:"25px",borderRadius:12,borderLeft:"5px solid #C8960C",boxShadow:"0 4px 12px rgba(0,0,0,0.05)"}}><h3>🏆 World's #1 Robusta</h3><p style={{fontSize:14,color:"#555",marginTop:8,lineHeight:1.6}}>Vietnam supplies over 40% of global Robusta beans — the gold standard for espresso blends worldwide.</p></div>
<div style={{background:"#fff",padding:"25px",borderRadius:12,borderLeft:"5px solid #C8960C",boxShadow:"0 4px 12px rgba(0,0,0,0.05)"}}><h3>🇪🇺 0% Tariff (EVFTA)</h3><p style={{fontSize:14,color:"#555",marginTop:8,lineHeight:1.6}}>Enjoy 0% import duty into the European Union markets, establishing a direct price advantage.</p></div>
<div style={{background:"#fff",padding:"25px",borderRadius:12,borderLeft:"5px solid #C8960C",boxShadow:"0 4px 12px rgba(0,0,0,0.05)"}}><h3>🛡️ EUDR & BRC Compliant</h3><p style={{fontSize:14,color:"#555",marginTop:8,lineHeight:1.6}}>Our strictly verified farm networks meet EU Deforestation Regulations and highest international food safety standards.</p></div>
</div>
<h2 style={{fontFamily:"'Playfair Display',serif",fontSize:"32px",marginBottom:35,color:"#0D2B1E"}}>Verified Exporters</h2>
<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(320px,1fr))",gap:30}}>
{suppliers.map(s=>(<div key={s.name} style={{background:"#fff",border:"1px solid #E5DDD0",borderRadius:16,overflow:"hidden",boxShadow:"0 4px 15px rgba(0,0,0,0.05)",display:"flex",flexDirection:"column",justifyContent:"space-between"}}>
<div>
<img src={s.img} className="supplier-img" alt={s.name}/>
<div style={{padding:"20px 20px 0"}}><span style={{background:"rgba(27,67,50,0.1)",color:"#1B4332",padding:"4px 10px",borderRadius:4,fontSize:11,fontWeight:700}}>{s.cat}</span>
<h3 style={{marginTop:12,fontSize:19,color:"#0D2B1E"}}>{s.name}</h3><p style={{fontSize:13,color:"#C8960C",fontWeight:600,margin:"6px 0"}}>{s.tag}</p><p style={{fontSize:13,color:"#6B7280",lineHeight:1.6}}>{s.desc}</p></div>
</div>
<div style={{padding:"0 20px 20px"}}>
<div style={{borderTop:"1px solid #E5DDD0",borderBottom:"1px solid #E5DDD0",margin:"20px 0",padding:"12px 0",display:"flex",justifyContent:"space-between",fontSize:13}}>
<div><div style={{color:"#888",fontSize:11,marginBottom:2}}>{t.moq}</div><strong>{s.moq}</strong></div><div><div style={{color:"#888",fontSize:11,marginBottom:2}}>{t.cap}</div><strong>{s.cap}</strong></div>
</div><button onClick={()=>setOpen(true)} style={{width:"100%",background:"#0D2B1E",color:"#fff",border:"none",borderRadius:8,padding:"12px",fontWeight:700,cursor:"pointer",fontSize:14,transition:"0.2s" }}>📋 Request Quotation</button></div>
</div>))}
</div>
</div>
<footer style={{background:"#0D2B1E",color:"rgba(255,255,255,0.5)",padding:"40px 20px",textAlign:"center",marginTop:"auto",fontSize:13,borderTop:"3px solid #C8960C"}}>
<p>© 2026 Source Vietnam Coffee · Admin: {ADMIN_EMAIL} · All rights reserved.</p>
</footer>
{open && (
<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",padding:15}} onClick={()=>setOpen(false)}>
<div style={{background:"#fff",borderRadius:16,width:"100%",maxWidth:500,padding:30,margin:"auto"} } onClick={e=>e.stopPropagation()}>
<h2 style={{fontFamily:"'Playfair Display',serif",marginBottom:20,fontSize:24}}>Request For Quotation (RFQ)</h2>
<form onSubmit={handleSubmit} style={{display:"grid",gap:12}}>
<input required placeholder="Company Name" style={{width:"100%",padding:12,border:"1px solid #E5DDD0",borderRadius:8}} onChange={e=>form.company=e.target.value}/>
<input required placeholder="Contact Person" style={{width:"100%",padding:12,border:"1px solid #E5DDD0",borderRadius:8}} onChange={e=>form.contact=e.target.value}/>
<input required placeholder="Business Email" type="email" style={{width:"100%",padding:12,border:"1px solid #E5DDD0",borderRadius:8}} onChange={e=>form.email=e.target.value}/>
<input required placeholder="Product & Quantity (e.g., 2 Containers Robusta)" style={{width:"100%",padding:12,border:"1px solid #E5DDD0",borderRadius:8}} onChange={e=>form.product=e.target.value}/>
<textarea placeholder="Message (Destination Port, Packaging, Certifications...)" rows={3} style={{width:"100%",padding:12,border:"1px solid #E5DDD0",borderRadius:8,fontFamily:"inherit"}} onChange={e=>form.msg=e.target.value}/>
<div style={{fontSize:11,color:"#6B7280",background:"#F9F5F0",padding:"10px",borderRadius:6,border:"1px solid #E5DDD0"}}>🔒 Leads will be forwarded directly to admin email: {ADMIN_EMAIL}</div>
<button type="submit" style={{background:"#0D2B1E",color:"#fff",border:"none",padding:14,borderRadius:8,fontWeight:700,cursor:"pointer",fontSize:15}}>Send Sourcing Request</button>
</form>
</div>
</div>
)}
{success && (
<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",padding:15}}>
<div style={{background:"#fff",borderRadius:16,padding:35,textAlign:"center",maxWidth:420,margin:"auto"}}>
<div style={{fontSize:45,marginBottom:15}}>✅</div><h2 style={{fontFamily:"'Playfair Display',serif",marginBottom:10}}>RFQ Submitted Successfully!</h2>
<p style={{fontSize:14,color:"#6B7280",margin:"10px 0 25px",lineHeight:1.6}}>Our team will review your sourcing request and match you with verified suppliers within 24–48 hours.</p>
<button onClick={()=>setSuccess(false)} style={{background:"#0D2B1E",color:"#fff",border:"none",padding:"10px 25px",borderRadius:8,cursor:"pointer",fontWeight:700}}>Close</button>
</div>
</div>
)}
</div>
);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
